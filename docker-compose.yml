version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: pulse-db
    environment:
      - POSTGRES_DB=pulse
      - POSTGRES_USER=pulse
      - POSTGRES_PASSWORD=pulse
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pulse-app:latest
    container_name: pulse-app
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://pulse:pulse@db:5432/pulse?sslmode=disable

volumes:
  postgres-data:
