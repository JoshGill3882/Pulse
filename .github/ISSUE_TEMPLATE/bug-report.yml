name: Bug Report
description: Report a reproducible defect or regression.
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: >
        Thanks for helping us improve Pulse. Please provide as much detail as possible
        so we can reproduce and resolve the issue quickly.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Short description of the bug.
      placeholder: Crash when saving dashboard
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include app version, OS, deployment target, and any relevant configuration.
      placeholder: |
        App version: 1.2.3
        OS: Windows 11
        Deployment: Production
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      description: List the actions leading to the bug, numbered in order.
      placeholder: |
        1. Go to …
        2. Click on …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Outcome
      description: Describe what you expected to happen.
      placeholder: The dashboard saves successfully.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Outcome
      description: Describe what actually happened, including stack traces or screenshots when available.
      placeholder: An error toast appears with the message "Unable to save dashboard".
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: How severe is this issue for users or the release?
      options:
        - Blocks release
        - Critical functionality broken
        - Degraded experience
        - Minor inconvenience
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Provide logs, related issues, links, or any other helpful information.
      placeholder: Paste logs, stack traces, or relevant links here.
