name: Feature Request
description: Propose a new capability or improvement to Pulse.
title: "[Feature]: "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: >
        Share the key details we need to understand the opportunity and evaluate the work.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: One-line description of the feature.
      placeholder: Support scheduled report exports
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem To Solve
      description: What user pain, business need, or workflow gap does this feature address?
      placeholder: >
        Customer success teams spend hours manually exporting weekly dashboards for clients.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired Outcome
      description: Describe the impact or success measure once the feature ships.
      placeholder: >
        Automate weekly client dashboard delivery and cut manual prep time by 50%.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Outline the preferred approach, UX direction, or technical ideas.
      placeholder: >
        Add a scheduling option to the report builder allowing users to email reports
        to distribution lists with a predefined cadence.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: List the user-visible scenarios that must be satisfied for this feature to ship.
      placeholder: |
        - Given a saved report, when I set a weekly schedule, subscribers receive the report at the scheduled time.
        - Given multiple schedules, when I edit an existing one, the update is reflected immediately.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Include discovery notes, urgency, metrics, or related issues.
      placeholder: Link to research notes, mockups, or other supporting documents.
