name: Feature request
description: Suggest an enhancement for Pulse.
title: ""
labels:
  - feature
assignees:
  - JoshGill3882
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is the feature and why is it needed?
      placeholder: Outline the user problem and the value this feature adds.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: What needs to be true for this work to be considered complete?
      placeholder: |
        - [ ] A user can...
        - [ ] Reports include...
    validations:
      required: true
  - type: textarea
    id: blocking
    attributes:
      label: Blocking Issues
      description: List issues that block or are blocked by this request.
      placeholder: |
        Blocks: #123
        Blocked by: #456
  - type: textarea
    id: performance
    attributes:
      label: Performance Considerations
      description: Note any latency, throughput, or resource constraints.
      placeholder: >
        e.g. API must respond within 300ms for 95% of requests.
  - type: textarea
    id: scalability
    attributes:
      label: Scalability Considerations
      description: Describe capacity expectations or scale-related requirements.
      placeholder: >
        e.g. Support 10x increase in concurrent dashboards without degradation.
  - type: textarea
    id: security
    attributes:
      label: Security Considerations
      description: Capture authentication, authorization, or data protection needs.
      placeholder: >
        e.g. Feature must respect row-level access rules.
  - type: textarea
    id: comments
    attributes:
      label: Additional Comments
      description: Anything else reviewers should know.
      placeholder: >
        Link to research notes, designs, or related documentation.
